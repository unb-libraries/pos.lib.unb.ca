dockworker:
  version: '6'
  application:
    name: POS application for UNB Libraries.
    uri: https://pos.lib.unb.ca
    description: >
      A Point of Sale (POS) application for use in University of New Brunswick Libraries.
    topics:
      - pos
    identifiers:
      id: pos.lib.unb.ca
      slug: pos-lib-unb-ca
      short_slug: pos
      uuid: 3103
    framework:
      name: ospos
      version: 3
      startup_finished_marker: '99_z_notify_user_URI'
      endpoint:
        name: http
        port: 80
        readiness_timeout: 15
    license:
      license: MIT
      holder: University of New Brunswick Libraries
    shell:
      path: /bin/sh
  endpoints:
    env:
      - dev
      - prod
    deployments:
      pos-lib-unb-ca:
        default: true
        managed: true
        name: pos.lib.unb.ca
      ospos-mysql-lib-unb-ca:
        managed: false
        name: mysql
  workflows:
    vcs:
      type: github
      owner: unb-libraries
      name: pos.lib.unb.ca
    jira:
      project_keys:
        - POS
    image:
      name: ghcr.io/unb-libraries/pos.lib.unb.ca
      parent: ghcr.io/unb-libraries/nginx-php:3.18.x
      repository: GitHub
      push-branches:
        - dev
        - prod
